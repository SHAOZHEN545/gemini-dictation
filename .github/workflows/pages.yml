# Publish the browser version (web/) plus the shared vocabulary to GitHub Pages on every push to main.
name: Deploy web app

on:
  push:
    branches: [main]
    paths: ["web/**", "config/vocabulary.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r web/. _site/
          if [ -f config/vocabulary.txt ]; then cp config/vocabulary.txt _site/vocabulary.txt; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
