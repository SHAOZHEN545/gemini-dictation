plugins {
    id 'com.android.application'
}

android {
    namespace 'com.geminidictation.keyboard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.geminidictation.keyboard'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
