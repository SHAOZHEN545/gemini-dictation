[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-live-dictation"
version = "0.1.0"
description = "Private Windows command-line dictation using Gemini Live Transcription"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av>=18.1.0",
  "google-genai>=1.0.0",
  "sounddevice>=0.5.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
gemini-live-dictation = "gemini_live_dictation.cli:main"
gemini-live-gui = "gemini_live_dictation.gui:main"

[tool.setuptools.packages.find]
include = ["gemini_live_dictation*"]

[tool.setuptools.package-data]
gemini_live_dictation = ["assets/*.png", "assets/*.ico"]
